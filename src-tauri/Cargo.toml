[package]
name = "terax"
version = "0.9.0"
description = "Terax — an open-source terminal workspace with editor, source control and previews"
authors = ["crynta"]
license = "Apache-2.0"
edition = "2021"
default-run = "terax"

[workspace]
members = ["crates/terax-cli", "crates/terax-control-protocol"]
default-members = [".", "crates/terax-cli", "crates/terax-control-protocol"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Real-application benchmark ("app lab", scripts/app-lab). Never part of a shipped build: it adds
# the bench-only commands in modules/bench.rs and refuses to run under the product identifier.
bench = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# `protocol-asset` backs the bounded local-file asset delivery. `macos-private-api` (which backed
# the transparent NSVisualEffectView window) was removed with the macOS distribution support in
# ticket #34: the fork builds Linux x86-64 only, and tauri-build refuses a Tauri feature that
# `tauri.conf.json` does not enable.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
getrandom = "0.4"
sha2 = "0.10"
percent-encoding = "2"
http-range = "0.1"
memchr = "2"
terax-control-protocol = { path = "crates/terax-control-protocol" }
portable-pty = "0.9"
dirs = "7"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
regex = "1"
grep-searcher = "0.1"
globset = "0.4"
nucleo-matcher = "0.3"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tempfile = "3"

[dev-dependencies]
terax-cli = { path = "crates/terax-cli" }
proptest = "1"
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
tempfile = "3"
wasmparser = { version = "=0.261.0", default-features = false, features = ["std", "validate", "features", "simd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# inotify (Linux) and ReadDirectoryChangesW (Windows). macOS drives FSEvents
# directly (see fs/watch/macos.rs), which keeps notify out of that build.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = "8.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSPasteboard", "NSPasteboardItem", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSURL", "NSString", "NSUserDefaults", "NSValue"] }
fsevent-sys = "4.1"
window-vibrancy = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
windows-sys = { version = "0.61", features = [
	"Wdk_Foundation",
	"Wdk_Storage_FileSystem",
	"Wdk_System_SystemServices",
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_Console",
	"Win32_System_DataExchange",
	"Win32_System_JobObjects",
	"Win32_System_IO",
	"Win32_System_Ole",
	"Win32_System_SystemInformation",
	"Win32_System_ProcessStatus",
	"Win32_System_Threading",
	"Win32_System_WindowsProgramming",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree via tauri; used directly for the file clipboard.
gtk = "0.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true

# rust-lang/rust#110536: stripping proc-macro dylibs breaks the dlopen rustc does
# at compile time on macOS, reported as a bogus E0463. Never shipped, so nothing to strip.
[profile.release.build-override]
strip = false
