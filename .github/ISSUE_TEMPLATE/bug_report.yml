name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the fields below — it makes triage much faster.

        This repository is an **unofficial Linux x86-64 fork** of Terax (upstream: `crynta/terax-ai`); it is not the upstream product. For **security issues**, do NOT open an issue. See [SECURITY.md](https://github.com/kevsmir02/terax-ai/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: From Settings → About, or the commit you built from.
      placeholder: "1.0.0, or 16ef644"
    validations:
      required: true

  - type: dropdown
    id: artifact
    attributes:
      label: How are you running it?
      description: This fork builds Linux x86-64 packages only (ticket #34).
      options:
        - RPM package
        - DEB package
        - Arch recipe built locally (packaging/arch)
        - Built from source
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution and desktop
      placeholder: "Fedora 44 KDE Plasma (Wayland) / Debian 13 GNOME (Wayland) / Arch (date)"
    validations:
      required: true

  - type: input
    id: webkitgtk
    attributes:
      label: WebKitGTK version
      description: Run `pkg-config --modversion webkit2gtk-4.1` (or `webkit2gtk-4.0` if that is what your distribution ships).
      placeholder: "2.48.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered list of exact steps. The more specific, the faster we can help.
      placeholder: |
        1. Start the application from a terminal
        2. Open ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        If applicable, paste relevant logs (devtools console, terminal output) or attach screenshots.
        On Linux: launch from a terminal to see stderr.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I am running the latest commit or the latest stable package
          required: false
