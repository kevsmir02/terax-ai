name: Release candidate

on:
  # Nothing here publishes, and nothing triggers it automatically. The gate that would make a
  # version tag safe — tag/application-version agreement, required CI green for that exact commit,
  # authenticated artifacts and install/upgrade evidence — is ticket #40 (GitHub issue #41) and is
  # on an execution hold. Until that gate exists a tag must produce no artifact set at all, so this
  # workflow only builds, verifies and hands out a candidate set when a maintainer asks for one.
  # `scripts/tests/test_ci_workflows.py` fails if a tag trigger or any release upload comes back
  # without the gate.
  workflow_dispatch:

jobs:
  build-candidate:
    # Linux x86-64 is the only platform this fork builds or distributes (ticket #34). The package
    # formats come from `bundle.targets` in `src-tauri/tauri.conf.json` (`rpm`, `deb`), and the
    # packaging runner builds exactly those two, so there is no AppImage, no macOS leg, no Windows
    # leg and no aarch64 leg to keep in step. This job produces and inspects candidates;
    # publishing them is issue #41.
    name: build-candidate (linux x86-64, no publication)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # `cpio` (with `rpm`'s `rpm2cpio`) is what `scripts/package-candidate/run.py` uses to
          # read an rpm payload back; without it the job fails after a full build.
          sudo apt-get install -y \
            cpio \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust 1.99.1 (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: x86_64-unknown-linux-gnu

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: linux-x86_64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the x86-64 RPM and DEB candidate set
        env:
          # `scripts/build-cli.mjs` names the sidecar with this triple, so the external binary
          # Tauri bundles is the one built for the released architecture.
          TERAX_CLI_TARGET: x86_64-unknown-linux-gnu
        # The packaging runner, not a bare `pnpm tauri build`: it writes
        # `inputs/tauri.candidate.conf.json` from the shared identity table
        # (`src/modules/identity/namespace.json` via `scripts/packaging.py`) and passes it with
        # `--config`. A base-config build would ship upstream's product name, description and
        # `/usr/bin/terax` instead of the candidate identity.
        run: python3 scripts/package-candidate/run.py

      - name: Verify the candidate identity and stage the artifacts
        run: |
          set -euo pipefail
          # The runner writes one directory per revision and refuses to overwrite a completed
          # one, so exactly one candidate may exist after the build.
          manifests=(dist-packages/*/manifest.json)
          test "${#manifests[@]}" -eq 1
          candidate="$(dirname "${manifests[0]}")"
          test -f "$candidate/manifest.json"
          # Exactly the two configured bundle formats: a third format appearing here would be a
          # platform commitment this fork did not make. The runner copies the artifacts under
          # stable names and records their hashes.
          mkdir linux-packages
          for package in "$candidate"/*.deb "$candidate"/*.rpm; do
            test -s "$package"
            cp "$package" linux-packages/
          done
          test "$(dpkg-deb -f linux-packages/*.deb Architecture)" = "amd64"
          test "$(rpm -qp --queryformat '%{ARCH}' linux-packages/*.rpm)" = "x86_64"
          dpkg-deb -x linux-packages/*.deb unpacked-deb
          # The candidate installs this fork's workspace binaries. Upstream's `/usr/bin/terax`
          # here would mean the overlay was not applied, which the packaging runner refuses.
          test ! -e unpacked-deb/usr/bin/terax
          unpacked-deb/usr/bin/*-cli --help
          file unpacked-deb/usr/bin/*
          cp "$candidate/SHA256SUMS" "$candidate/manifest.json" linux-packages/
          (cd linux-packages && sha256sum -c SHA256SUMS)
          stat --printf='%n %s bytes\n' linux-packages/* >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the candidate artifact set
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-packages
          path: linux-packages/
          if-no-files-found: error
