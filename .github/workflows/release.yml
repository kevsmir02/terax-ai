name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs build the same Linux x86-64 artifact set without publishing: the upload steps
  # require a tag push, so a dispatch never touches a release.
  workflow_dispatch:

jobs:
  publish-tauri:
    # Linux x86-64 is the only platform this fork builds or distributes (ticket #34). The package
    # formats come from `bundle.targets` in `src-tauri/tauri.conf.json` (`rpm`, `deb`), so there is
    # no AppImage, no macOS leg, no Windows leg and no aarch64 leg to keep in step. Packaging,
    # signing and publication gates are tickets #39/#40; this job produces and inspects candidates.
    name: publish-tauri (linux x86-64)
    runs-on: ubuntu-22.04
    outputs:
      app-version: ${{ steps.tauri.outputs.appVersion }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust 1.99.1 (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: x86_64-unknown-linux-gnu

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: linux-x86_64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `scripts/build-cli.mjs` names the sidecar with this triple, so the external binary
          # Tauri bundles is the one built for the released architecture.
          TERAX_CLI_TARGET: x86_64-unknown-linux-gnu
        with:
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('Terax {0}', github.ref_name) || '' }}
          # Updates are installed with the distribution's package tool, never by the application,
          # so the release text must not promise a built-in updater.
          releaseBody: "Linux x86-64 only. Install the RPM (dnf) or DEB (apt) with your package manager; the application never downloads, installs or restarts itself."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-unknown-linux-gnu

      - name: Verify the x86-64 RPM and DEB and stage the artifacts
        run: |
          set -euo pipefail
          mkdir linux-packages
          # Exactly the two configured bundle formats: a third format appearing here would be a
          # platform commitment this fork did not make.
          for package in src-tauri/target/release/bundle/{deb/*.deb,rpm/*.rpm}; do
            test -s "$package"
            cp "$package" linux-packages/
          done
          test "$(dpkg-deb -f linux-packages/*.deb Architecture)" = "amd64"
          test "$(rpm -qp --queryformat '%{ARCH}' linux-packages/*.rpm)" = "x86_64"
          dpkg-deb -x linux-packages/*.deb unpacked-deb
          unpacked-deb/usr/bin/terax-workspace-cli --help
          file unpacked-deb/usr/bin/terax
          (cd linux-packages && sha256sum * > SHA256SUMS)
          stat --printf='%n %s bytes\n' linux-packages/* >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release artifact set
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-packages
          path: linux-packages/
          if-no-files-found: error

      - name: Upload the packages and their hashes to the draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" linux-packages/* --clobber \
            --repo "$GITHUB_REPOSITORY"
